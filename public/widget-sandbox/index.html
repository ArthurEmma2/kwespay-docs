<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>KwesPay checkout simulation</title>
		<link rel="stylesheet" href="sandbox.css" />
		<script src="sandbox.js"></script>
	</head>
	<body>
		<main class="store">
			<p class="store-label">Example store</p>
			<h1 class="store-title">Order <span data-order-ref>#1042</span></h1>
			<dl class="store-lines">
				<div><dt>Item</dt><dd>Annual plan</dd></div>
				<div><dt>Total</dt><dd data-order-total></dd></div>
			</dl>
			<button type="button" class="store-pay" data-open-checkout>Pay with crypto</button>
			<p class="store-result" data-result hidden></p>
		</main>
		<div class="wallet" data-wallet hidden role="dialog" aria-modal="false" aria-labelledby="wallet-title">
			<p class="wallet-name">KwesPay Test Wallet</p>
			<p class="wallet-title" id="wallet-title" data-wallet-title></p>
			<dl class="wallet-details" data-wallet-details></dl>
			<div class="wallet-actions">
				<button type="button" class="wallet-reject" data-wallet-reject>Reject</button>
				<button type="button" class="wallet-confirm" data-wallet-confirm>Confirm</button>
			</div>
		</div>
		<script src="kwespay-widget.min.js"></script>
		<script src="checkout.js"></script>
	</body>
</html>
